[package]
name = "voicenote-core"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
coreml = []

[dependencies]
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
thiserror = "1"
tract-onnx = "0.21"
whisper-rs = "0.12"
regex = "1"
ring = "0.17"
jni = { version = "0.21", default-features = false }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cbindgen = "0.27"
